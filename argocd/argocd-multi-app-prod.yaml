apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamlit-apps-multi-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/OriKomemi/Gitops-ArgoCD.git
    targetRevision: HEAD  # Use main branch or specific tag for prod
    path: helm/streamlit-apps-multi

    helm:
      # Use production values
      valueFiles:
        - values-prod.yaml

      # Override specific parameters
      parameters:
        - name: global.domain
          value: apps.openshift.example.com
        - name: global.image.repository
          value: your-registry.example.com/streamlit-apps
        - name: global.image.tag
          value: "1.0.0"  # Use specific version in production

        # Configure routing strategy
        - name: global.routingStrategy
          value: "both"

        # Enable all apps
        - name: apps.dashboard.enabled
          value: "true"
        - name: apps.analytics.enabled
          value: "true"
        - name: apps.admin.enabled
          value: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: streamlit-apps-prod

  syncPolicy:
    # Manual sync for production (change to automated if desired)
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Ignore when HPA is enabled
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /status
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status

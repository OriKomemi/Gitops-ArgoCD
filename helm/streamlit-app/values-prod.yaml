# Values for production environment
# Override the default values for production deployment

replicaCount: 3

image:
  repository: your-registry.example.com/streamlit-app
  pullPolicy: Always
  tag: "1.0.0"  # Use specific version tags in production

# Service configuration
service:
  type: ClusterIP
  port: 8501
  targetPort: 8501

# OpenShift Route configuration for production
route:
  enabled: true
  annotations:
    haproxy.router.openshift.io/timeout: 120s
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "100"
  host: streamlit-app.apps.openshift.example.com
  path: /
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Production resources with higher limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Enable autoscaling in production
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Production-grade probe settings
livenessProbe:
  httpGet:
    path: /_stcore/health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /_stcore/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Pod annotations for production
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8501"
  prometheus.io/path: "/metrics"

# Pod anti-affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - streamlit-app
          topologyKey: kubernetes.io/hostname

# Tolerations for production nodes (if using dedicated nodes)
# tolerations:
#   - key: "workload"
#     operator: "Equal"
#     value: "production"
#     effect: "NoSchedule"

# Node selector for production nodes (if using dedicated nodes)
# nodeSelector:
#   node-role.kubernetes.io/production: "true"

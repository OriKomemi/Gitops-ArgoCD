{{- if not .Values.global.sharedService }}
{{- range $appName, $appConfig := .Values.apps }}
{{- if $appConfig.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamlit-apps-multi.appFullname" (dict "appName" $appName "context" $) }}
  labels:
    {{- include "streamlit-apps-multi.appLabels" (dict "appName" $appName "context" $) | nindent 4 }}
  {{- with $appConfig.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $appConfig.service.type }}
  ports:
    - port: {{ $appConfig.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq $appConfig.service.type "NodePort") $appConfig.service.nodePort }}
      nodePort: {{ $appConfig.service.nodePort }}
      {{- end }}
  selector:
    {{- include "streamlit-apps-multi.appSelectorLabels" (dict "appName" $appName "context" $) | nindent 4 }}
{{- end }}
{{- end }}
{{- else }}
---
# Shared service for all apps
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamlit-apps-multi.fullname" . }}-shared
  labels:
    {{- include "streamlit-apps-multi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8501
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "streamlit-apps-multi.selectorLabels" . | nindent 4 }}
{{- end }}
